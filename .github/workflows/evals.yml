name: AI Eval Suite — Brasil 2040

on:
  workflow_dispatch:
    inputs:
      test_suite:
        description: "Which tests to run"
        required: false
        default: "all"
        type: choice
        options:
          - retrieval
          - faithfulness
          - latency
          - regression
          - all

env:
  SEARCH_ENDPOINT: "http://localhost:8000/search"
  JUDGE_BACKEND: "gemini"
  JUDGE_MODEL: "gemma-4-31b-it"
  GEMINI_ANSWER_MODEL: "gemma-4-31b-it"
  FAITHFULNESS_THRESHOLD: "0.6"
  HALLUCINATION_THRESHOLD: "0.6"
  SIMILARITY_THRESHOLD: "0.3"
  RETRIEVAL_P95_MS: "5.0"

jobs:

  # ── STAGE 1: Fast deterministic tests ──────────────────────────────────────
  retrieval-evals:
    name: "① Retrieval Precision"
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.test_suite == 'retrieval' ||
      github.event.inputs.test_suite == 'all'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            evals/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r evals/requirements.txt
          pip install pytest-html

      - name: Create reports directory
        run: mkdir -p evals/reports

      - name: Start FastAPI server
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/ > /dev/null 2>&1 && echo "✓ Server ready" && break
            echo "  attempt $i/60..." && sleep 3
          done
          curl -sf http://localhost:8000/ || (echo "Server failed to start" && exit 1)

      - name: Run retrieval tests
        run: |
          pytest evals/test_retrieval.py \
            -v --tb=short \
            --html=evals/reports/retrieval_report.html \
            --self-contained-html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-report
          path: evals/reports/retrieval_report.html

  latency-evals:
    name: "① Latency & Cost"
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.test_suite == 'latency' ||
      github.event.inputs.test_suite == 'all'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            evals/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r evals/requirements.txt
          pip install pytest-html

      - name: Create reports directory
        run: mkdir -p evals/reports

      - name: Start FastAPI server
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/ > /dev/null 2>&1 && echo "✓ Server ready" && break
            echo "  attempt $i/60..." && sleep 3
          done
          curl -sf http://localhost:8000/ || (echo "Server failed to start" && exit 1)

      - name: Run latency tests
        run: |
          pytest evals/test_latency_cost.py \
            -v -s --tb=short \
            --html=evals/reports/latency_report.html \
            --self-contained-html \
            -k "not end_to_end"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latency-report
          path: evals/reports/latency_report.html

  # ── STAGE 2: Slow LLM judge tests (run in parallel, independent of stage 1) -
  faithfulness-evals:
    name: "② Faithfulness & Hallucination"
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.test_suite == 'faithfulness' ||
      github.event.inputs.test_suite == 'all'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            evals/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r evals/requirements.txt
          pip install pytest-html

      - name: Create reports directory
        run: mkdir -p evals/reports

      - name: Start FastAPI server
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/ > /dev/null 2>&1 && echo "✓ Server ready" && break
            echo "  attempt $i/60..." && sleep 3
          done
          curl -sf http://localhost:8000/ || (echo "Server failed to start" && exit 1)

      - name: Run faithfulness tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pytest evals/test_faithfulness.py \
            -v --tb=short \
            --html=evals/reports/faithfulness_report.html \
            --self-contained-html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faithfulness-report
          path: evals/reports/faithfulness_report.html

  prompt-regression:
    name: "② Prompt Regression"
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.test_suite == 'regression' ||
      github.event.inputs.test_suite == 'all'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            evals/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r evals/requirements.txt
          pip install pytest-html

      - name: Create reports directory
        run: mkdir -p evals/reports

      - name: Start FastAPI server
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/ > /dev/null 2>&1 && echo "✓ Server ready" && break
            echo "  attempt $i/60..." && sleep 3
          done
          curl -sf http://localhost:8000/ || (echo "Server failed to start" && exit 1)

      - name: Run prompt regression tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REGRESSION_MODE: "compare"
        run: |
          pytest evals/test_prompt_regression.py \
            -v --tb=short \
            --html=evals/reports/regression_report.html \
            --self-contained-html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-report
          path: evals/reports/regression_report.html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-diff
          path: evals/reports/regression_diff.json