name: AI Eval Suite — Brasil 2040 v3

on:
  workflow_dispatch:
    inputs:
      test_suite:
        description: "Which tests to run"
        required: false
        default: "all"
        type: choice
        options:
          - retrieval
          - faithfulness
          - latency
          - regression
          - all

env:
  SEARCH_ENDPOINT: "http://localhost:8000/search"
  CHAT_ENDPOINT: "http://localhost:8000/chat"
  JUDGE_BACKEND: "groq"
  RETRIEVAL_P95_SEC: "5.0"
  RETRIEVAL_P50_SEC: "3.0"
  LONG_QUERY_MAX_RATIO: "3.0"
  END_TO_END_MAX_SEC: "20"
  JUDGE_REQUEST_DELAY: "45"
  JUDGE_MAX_RETRIES: "5"
  JUDGE_MAX_TOKENS: "2048"

jobs:
  evals:
    name: "Evals (${{ inputs.test_suite }})"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Restore embedding model cache
        id: hf-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface
          key: hf-multilingual-e5-large

      - name: Install dependencies
        run: pip install -r evals/requirements.txt

      - name: Start FastAPI server
        id: server
        timeout-minutes: 5
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p evals/reports
          uvicorn main:app --host 0.0.0.0 --port 8000 > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/health > /dev/null 2>&1 && echo "✓ Server ready" && break
            echo "  attempt $i/60..." && sleep 3
          done
          curl -sf http://localhost:8000/health || (echo "Server failed to start" && cat server.log && exit 1)

      - name: Save embedding model cache
        if: ${{ steps.hf-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/huggingface
          key: hf-multilingual-e5-large  

      - name: Run retrieval tests
        id: retrieval
        if: ${{ inputs.test_suite == 'retrieval' || inputs.test_suite == 'all' }}
        timeout-minutes: 10
        run: |
          pytest evals/test_retrieval.py \
            -v --tb=short \
            --html=evals/reports/retrieval_report.html \
            --self-contained-html

      - name: Run faithfulness tests
        id: faithfulness
        if: ${{ !cancelled() && steps.server.outcome == 'success' && (inputs.test_suite == 'faithfulness' || (inputs.test_suite == 'all' && steps.retrieval.outcome == 'success')) }}
        timeout-minutes: 45
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          pytest evals/test_faithfulness.py \
            -v --tb=short \
            --html=evals/reports/faithfulness_report.html \
            --self-contained-html

      - name: Run latency tests
        id: latency
        if: ${{ !cancelled() && steps.server.outcome == 'success' && (inputs.test_suite == 'latency' || (inputs.test_suite == 'all' && steps.retrieval.outcome == 'success')) }}
        timeout-minutes: 10
        run: |
          pytest evals/test_latency_cost.py \
            -v -rP --tb=short \
            --html=evals/reports/latency_report.html \
            --self-contained-html

      - name: Run prompt regression tests
        id: regression
        if: ${{ !cancelled() && steps.server.outcome == 'success' && (inputs.test_suite == 'regression' || (inputs.test_suite == 'all' && steps.retrieval.outcome == 'success')) }}
        timeout-minutes: 10
        run: |
          pytest evals/test_prompt_regression.py \
            -v --tb=short \
            --html=evals/reports/regression_report.html \
            --self-contained-html

      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports-${{ github.run_number }}
          path: evals/reports/
          if-no-files-found: ignore
          retention-days: 30