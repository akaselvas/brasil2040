name: AI Eval Suite — Brasil 2040

on:
  workflow_dispatch:
    inputs:
      test_suite:
        description: "Which tests to run"
        required: false
        default: "all"
        type: choice
        options:
          - retrieval
          - faithfulness
          - latency
          - regression
          - all

env:
  SEARCH_ENDPOINT: "http://localhost:8000/search"
  JUDGE_BACKEND: "gemini"
  JUDGE_MODEL: "gemma-4-31b-it"
  GEMINI_ANSWER_MODEL: "gemma-4-31b-it"
  FAITHFULNESS_THRESHOLD: "0.6"
  HALLUCINATION_THRESHOLD: "0.6"
  SIMILARITY_THRESHOLD: "0.3"
  RETRIEVAL_P95_MS: "5.0"

# Reusable step definitions via anchors aren't supported in GHA,
# so we use a composite action pattern via a shared setup step per job.

jobs:
  # ──────────────────────────────────────────────────────────────
  retrieval-evals:
    name: "Retrieval Precision Tests"
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.test_suite == 'retrieval' ||
      github.event.inputs.test_suite == 'all'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            evals/requirements.txt

      - name: Install all dependencies
        run: |
          pip install -r requirements.txt
          pip install -r evals/requirements.txt
          pip install pytest-html  # html reports

      - name: Create reports directory
        run: mkdir -p evals/reports

      - name: Start FastAPI server
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          echo "Waiting for server..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/ > /dev/null 2>&1 && echo "✓ Server ready after ${i}×2s" && break
            echo "  attempt $i/30..." && sleep 2
          done
          curl -sf http://localhost:8000/ || (echo "Server failed to start" && exit 1)

      - name: Run retrieval tests
        run: |
          pytest evals/test_retrieval.py \
          -v --tb=short \
          --html=evals/reports/retrieval_report.html \
          --self-contained-html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-report
          path: evals/reports/retrieval_report.html

  # ──────────────────────────────────────────────────────────────
  faithfulness-evals:
    name: "Faithfulness & Hallucination Tests"
    runs-on: ubuntu-latest
    needs: retrieval-evals
    if: |
      always() &&
      (github.event.inputs.test_suite == 'faithfulness' ||
       github.event.inputs.test_suite == 'all') &&
      needs.retrieval-evals.result == 'success'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            evals/requirements.txt

      - name: Install all dependencies
        run: |
          pip install -r requirements.txt
          pip install -r evals/requirements.txt
          pip install pytest-html

      - name: Create reports directory
        run: mkdir -p evals/reports

      - name: Start FastAPI server
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/ > /dev/null 2>&1 && echo "✓ Server ready" && break
            echo "  attempt $i/30..." && sleep 2
          done
          curl -sf http://localhost:8000/ || (echo "Server failed to start" && exit 1)

      - name: Run faithfulness tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pytest evals/test_faithfulness.py \
            -v --tb=short \
            --html=evals/reports/faithfulness_report.html \
            --self-contained-html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faithfulness-report
          path: evals/reports/faithfulness_report.html

  # ──────────────────────────────────────────────────────────────
  latency-evals:
    name: "Latency & Cost Tests"
    runs-on: ubuntu-latest
    needs: retrieval-evals
    if: |
      always() &&
      (github.event.inputs.test_suite == 'latency' ||
       github.event.inputs.test_suite == 'all') &&
      needs.retrieval-evals.result == 'success'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            evals/requirements.txt

      - name: Install all dependencies
        run: |
          pip install -r requirements.txt
          pip install -r evals/requirements.txt
          pip install pytest-html

      - name: Create reports directory
        run: mkdir -p evals/reports

      - name: Start FastAPI server
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/ > /dev/null 2>&1 && echo "✓ Server ready" && break
            echo "  attempt $i/30..." && sleep 2
          done
          curl -sf http://localhost:8000/ || (echo "Server failed to start" && exit 1)

      - name: Run latency tests
        run: |
          pytest evals/test_latency_cost.py \
            -v -s --tb=short \
            --html=evals/reports/latency_report.html \
            --self-contained-html \
            -k "not end_to_end"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latency-report
          path: evals/reports/latency_report.html

  # ──────────────────────────────────────────────────────────────
  prompt-regression:
    name: "Prompt Regression Tests"
    runs-on: ubuntu-latest
    needs: retrieval-evals
    if: |
      always() &&
      (github.event.inputs.test_suite == 'regression' ||
       github.event.inputs.test_suite == 'all') &&
      needs.retrieval-evals.result == 'success'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            evals/requirements.txt

      - name: Install all dependencies
        run: |
          pip install -r requirements.txt
          pip install -r evals/requirements.txt
          pip install pytest-html

      - name: Create reports directory
        run: mkdir -p evals/reports

      - name: Start FastAPI server
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/ > /dev/null 2>&1 && echo "✓ Server ready" && break
            echo "  attempt $i/30..." && sleep 2
          done
          curl -sf http://localhost:8000/ || (echo "Server failed to start" && exit 1)

      - name: Run prompt regression tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REGRESSION_MODE: "compare"
        run: |
          pytest evals/test_prompt_regression.py \
            -v --tb=short \
            --html=evals/reports/regression_report.html \
            --self-contained-html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-report
          path: evals/reports/regression_report.html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-diff
          path: evals/reports/regression_diff.json

  # ──────────────────────────────────────────────────────────────
  nightly-full-eval:
    name: "Full Eval Summary"
    runs-on: ubuntu-latest
    needs: [retrieval-evals, faithfulness-evals, latency-evals, prompt-regression]
    if: |
      always() &&
      github.event.inputs.test_suite == 'all' &&
      needs.retrieval-evals.result == 'success'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            evals/requirements.txt

      - name: Install all dependencies
        run: |
          pip install -r requirements.txt
          pip install -r evals/requirements.txt
          pip install pytest-html

      - name: Create reports directory
        run: mkdir -p evals/reports

      - name: Start FastAPI server
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/ > /dev/null 2>&1 && echo "✓ Server ready" && break
            echo "  attempt $i/30..." && sleep 2
          done
          curl -sf http://localhost:8000/ || (echo "Server failed to start" && exit 1)

      - name: Run full eval suite
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FAITHFULNESS_THRESHOLD: "0.75"
        run: |
          pytest evals/ \
            -v --tb=long \
            --html=evals/reports/full_eval_report.html \
            --self-contained-html \
            --ignore=evals/test_prompt_regression.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-eval-report-${{ github.run_number }}
          path: evals/reports/full_eval_report.html
          retention-days: 30